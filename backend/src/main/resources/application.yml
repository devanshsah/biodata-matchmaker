server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* headers from Cloudflare / a reverse proxy, so secure cookies work over HTTPS
  forward-headers-strategy: native
  compression:
    enabled: true

spring:
  application:
    name: devanshsah-site
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devansh}
    username: ${DATABASE_USER:devansh}
    password: ${DATABASE_PASSWORD:devansh}
    hikari:
      # Close idle connections quickly so a serverless Postgres (Neon) can go to sleep
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /api

app:
  # Shared secret Cloud Scheduler sends to /api/internal/reminders/tick
  cron-key: ${CRON_KEY:}
  session-secret: ${SESSION_SECRET:}
  vapid-subject: ${VAPID_SUBJECT:mailto:you@example.com}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  zone: Asia/Kolkata
